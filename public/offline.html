<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — COMRACARE Student Clinic</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7fbfb;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #134e4a; }
  .card { text-align: center; padding: 2.5rem 1.75rem; max-width: 20rem; }
  .badge { width: 64px; height: 64px; margin: 0 auto 1rem; border-radius: 18px; background: #17828b;
           display: grid; place-items: center; color: #fff; font-size: 28px; font-weight: 800; }
  h1 { font-size: 1.1rem; margin: 0 0 .5rem; }
  p { font-size: .82rem; line-height: 1.5; color: #5b7470; margin: 0 0 1.25rem; }
  a { display: inline-block; background: #17828b; color: #fff; text-decoration: none;
      font-weight: 700; font-size: .85rem; padding: .65rem 1.2rem; border-radius: 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">+</div>
    <h1>You're offline</h1>
    <p>No internet right now. Check your data or Wi-Fi — your consultations and notifications will pick up the moment you're back.</p>
    <a href="/">Try again</a>
  </div>
</body>
</html>
